
name: Build Spicy Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen ban zip moi nhat
        run: |
          ZIP=$(find . -name 'spicy-client*.zip' | while read -r f; do b=$(basename "$f"); n=$(echo "$b" | grep -o '([0-9]*)' | tr -d '()'); echo "${n:-0}|$f"; done | sort -t'|' -k1,1n | tail -n 1 | cut -d'|' -f2-)
          echo "Dung file: $ZIP"
          find . -name 'spicy-client*.zip'
          unzip -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle build --no-daemon
        working-directory: spicy-client
      - uses: actions/upload-artifact@v4
        with:
          name: spicy-client-jar
          path: |
            spicy-client/build/libs/*.jar
            !spicy-client/build/libs/*-sources.jar
